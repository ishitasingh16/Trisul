# NAVIS differential-drive robot with the Phase 2 sensor contract.

PROTO NavisRobot [
  field SFVec3f translation 0 0 0.14
  field SFRotation rotation 0 0 1 0
  field SFString name "navis_robot"
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Solid {
        DEF BASE_LINK
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.16 0.20 0.24
              roughness 0.72
            }
            geometry Box { size 0.42 0.34 0.16 }
          }
        ]
        boundingObject Box { size 0.42 0.34 0.16 }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          anchor 0 0.19 0
          axis 0 1 0
        }
        device [
          RotationalMotor {
            name "left_wheel_motor"
            maxTorque 2.0
          }
          PositionSensor { name "left_wheel_encoder" }
        ]
        endPoint Solid {
          translation 0 0.19 0
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.04 0.04 0.04 }
              geometry Cylinder { radius 0.09 height 0.04 }
            }
          ]
          boundingObject Cylinder { radius 0.09 height 0.04 }
          physics Physics { density -1 mass 0.12 }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          anchor 0 -0.19 0
          axis 0 1 0
        }
        device [
          RotationalMotor {
            name "right_wheel_motor"
            maxTorque 2.0
          }
          PositionSensor { name "right_wheel_encoder" }
        ]
        endPoint Solid {
          translation 0 -0.19 0
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.04 0.04 0.04 }
              geometry Cylinder { radius 0.09 height 0.04 }
            }
          ]
          boundingObject Cylinder { radius 0.09 height 0.04 }
          physics Physics { density -1 mass 0.12 }
        }
      }
      Solid {
        translation -0.15 0 0.06
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.72 0.74 0.76 }
            geometry Sphere { radius 0.06 }
          }
        ]
        boundingObject Sphere { radius 0.06 }
        physics Physics { density -1 mass 0.04 }
      }
      Camera {
        translation 0.21 0 0.09
        rotation 0 1 0 0
        name "camera"
        width 640
        height 480
        fieldOfView 1.0472
        recognition Recognition {
          frameColor 0.1 0.1 0.1
        }
      }
      Lidar {
        translation 0 0 0.17
        name "lidar"
        fieldOfView 6.28319
        horizontalResolution 200
        numberOfLayers 1
        minRange 0.05
        maxRange 5.6
      }
      InertialUnit {
        translation 0 0 0.16
        name "imu"
        resolution 0.001
      }
    ]
    controller "void"
    supervisor FALSE
  }
}
